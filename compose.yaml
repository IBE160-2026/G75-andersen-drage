# One command starts everything (AD-2): `docker compose up`.
# Tests: `docker compose run --rm test`. Dev: `docker compose --profile dev up`.

x-proxy-env: &proxy-env
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-5.5}
  GENERATION_TIMEOUT_S: ${GENERATION_TIMEOUT_S:-40}
  SIMPLER_TIMEOUT_S: ${SIMPLER_TIMEOUT_S:-15}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-10}

x-proxy-healthcheck: &proxy-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3).status == 200 else 1)"]
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

x-web-healthcheck: &web-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

services:
  proxy:
    build: ./proxy
    env_file:
      - path: .env
        required: false
    environment: *proxy-env
    healthcheck: *proxy-healthcheck
    read_only: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck: *web-healthcheck
    restart: unless-stopped

  # Test profile (Story 1.7): its own Proxy + web pair on an internal network, keyless,
  # with a raised rate limit so e2e never trips the guard. The web image rewrites to
  # http://proxy:8000, so proxy-test answers as `proxy` on that network.
  proxy-test:
    profiles: [test]
    build: ./proxy
    environment:
      <<: *proxy-env
      OPENROUTER_API_KEY: ""
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://web-test:3000
      RATE_LIMIT_PER_MIN: "1000"
    healthcheck: *proxy-healthcheck
    read_only: true
    networks:
      test:
        aliases: [proxy]

  web-test:
    profiles: [test]
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      proxy-test:
        condition: service_healthy
    healthcheck: *web-healthcheck
    networks: [test]

  test:
    profiles: [test]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      BASE_URL: http://web-test:3000
    depends_on:
      web-test:
        condition: service_healthy
    networks: [test]
    ipc: host

  proxy-dev:
    profiles: [dev]
    build: ./proxy
    env_file:
      - path: .env
        required: false
    environment:
      <<: *proxy-env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://127.0.0.1:8000}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--reload"]
    volumes:
      - ./proxy/app:/app/app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck: *proxy-healthcheck

  web-dev:
    profiles: [dev]
    image: node:26-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev"]
    environment:
      PROXY_ORIGIN: http://proxy-dev:8000
    volumes:
      - ./web:/app
      - web-dev-node-modules:/app/node_modules
      # `npm run dev` copies the sample notes from ../reference-notes first (Story 1.14).
      - ./reference-notes:/reference-notes:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      proxy-dev:
        condition: service_healthy

networks:
  # No route out: nothing in the test run can reach the provider or the internet.
  test:
    internal: true

volumes:
  web-dev-node-modules:
